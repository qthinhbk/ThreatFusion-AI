<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThreatFusion-AI | SOC Console</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            siemBg: '#090a0f',       // Deep flat matte grey
            siemCard: '#11131a',     // Solid dark panel
            siemBorder: '#22252f',   // Tight gray border
            siemHover: '#1c1e28',
            siemText: '#e2e4ea',
            siemMuted: '#7c8293',
            siemAccent: '#00b4d8'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-siemBg text-siemText font-sans h-full min-h-screen antialiased">

  <!-- React Root -->
  <div id="root" class="min-h-screen flex w-full"></div>

  <!-- Load Core Constants and Helpers -->
  <script src="data.js"></script>
  <script src="helpers.js"></script>

  <!-- Load Sub-components -->
  <script type="text/babel" src="components/OverviewTab.js"></script>
  <script type="text/babel" src="components/ExplorerTab.js"></script>
  <script type="text/babel" src="components/RulesTab.js"></script>
  <script type="text/babel" src="components/MapTab.js"></script>

  <!-- Load main React app controller -->
  <script type="text/babel" src="App.js"></script>
</body>
</html>
